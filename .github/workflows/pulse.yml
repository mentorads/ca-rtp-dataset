name: Weekly Automated Freshness Pulse

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freshness-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Freshness Timestamp
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          CURRENT_MONTH=$(date -u +"%B %Y")
          echo "Updating audit heartbeat to $CURRENT_DATE ($CURRENT_MONTH)..."
          
          # Update date in benchmarks.json
          sed -i "s/\"last_audit_date\": \".*\"/\"last_audit_date\": \"$CURRENT_DATE\"/g" benchmarks.json || true
          
          # Update sitemap lastmod
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>$CURRENT_DATE</lastmod>|g" sitemap.xml || true
          
          # Update build stamp in index.html
          sed -i "s/Audit Pulse: [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}/Audit Pulse: $CURRENT_DATE/g" index.html || true

      - name: Commit and Push Pulse
        run: |
          git config user.name "Monteclar Audit Bot"
          git config user.email "bot@monteclar.com"
          git add benchmarks.json sitemap.xml index.html
          git diff --staged --quiet || git commit -m "chore(audit-pulse): update weekly verification timestamp to $(date -u +'%Y-%m-%d')"
          git push origin main || git push origin master || true
